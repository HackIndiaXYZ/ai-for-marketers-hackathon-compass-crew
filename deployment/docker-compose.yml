version: '3.8'

services:
  # --- Next.js Frontend Service ---
  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    container_name: pain_to_ad_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_APP_NAME=PainToAd AI
    depends_on:
      - backend
    networks:
      - pain_to_ad_network

  # --- FastAPI Backend Service ---
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    container_name: pain_to_ad_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - PORT=8000
      - HOST=0.0.0.0
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=pain_to_ad_ai_db
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-1.5-pro
      - SECRET_KEY=${SECRET_KEY:-pain_to_ad_ai_secret_key_prod_2026}
      - BACKEND_CORS_ORIGINS=http://localhost:3000,http://localhost:8000
    depends_on:
      - mongodb
      - redis
    networks:
      - pain_to_ad_network

  # --- MongoDB Document Database ---
  mongodb:
    image: mongo:7.0
    container_name: pain_to_ad_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=pain_to_ad_ai_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - pain_to_ad_network

  # --- Redis Caching Layer ---
  redis:
    image: redis:7.2-alpine
    container_name: pain_to_ad_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pain_to_ad_network

  # --- Nginx Reverse Proxy Gateway ---
  nginx:
    image: nginx:1.25-alpine
    container_name: pain_to_ad_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - pain_to_ad_network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  pain_to_ad_network:
    driver: bridge
